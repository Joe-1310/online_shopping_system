<div
  class="modal fade"
  [class.show]="show"
  tabindex="-1"
  role="dialog"
  [style.display]="show ? 'block' : 'none'"
  (keydown)="onKeyDown($event)"
  (click)="onBackdropClick($event)"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>
          Confirm Deletion
        </h5>
        <button type="button" class="btn-close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <div class="text-center">
          <i class="bi bi-trash3 text-danger mb-3" style="font-size: 3rem"></i>
          <h6 class="mb-3">{{ defaultMessage }}</h6>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="onConfirm()">
          Delete {{ itemType }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="show" *ngIf="show"></div>
