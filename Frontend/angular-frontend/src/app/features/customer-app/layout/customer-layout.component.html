<div class="customer-layout">
  <!-- Customer Header -->
  <header class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" [routerLink]="['/shop/profile']">
        <i class="bi bi-shop me-2"></i>
        Shopping System
      </a>

      <nav class="navbar-nav me-auto">
        <a class="nav-link" [routerLink]="['/shop/products']" routerLinkActive="active">
          <i class="bi bi-grid me-1"></i>
          Products
        </a>
        <a class="nav-link" [routerLink]="['/shop/cart']" routerLinkActive="active">
          <i class="bi bi-cart me-1"></i>
          My Cart
        </a>
        <a class="nav-link" [routerLink]="['/shop/order-history']" routerLinkActive="active">
          <i class="bi bi-clock-history me-1"></i>
          Order History
        </a>
      </nav>

      <div class="navbar-nav">
        <div class="nav-item dropdown" *ngIf="currentUser">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle me-1"></i>
            {{ currentUser.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text">
                <small class="text-muted">{{ currentUser.email }}</small>
              </span>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" [routerLink]="['/shop/profile']">
                <i class="bi bi-person-circle me-2"></i>
                My Profile
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" href="#" (click)="handleLogout($event)">
                <i class="bi bi-box-arrow-right me-2"></i>
                Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Customer Footer -->
  <footer class="bg-light py-3 mt-5">
    <div class="container-fluid text-center">
      <p class="text-muted mb-0">© 2024 Online Shopping System</p>
    </div>
  </footer>

  <!-- Cart Sidebar -->
  <app-cart-sidebar></app-cart-sidebar>
</div>
